<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runway prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F5;--surface:#FFFFFF;--surface-2:#F5F7FA;--ink:#15202B;--muted:#586475;--line:#D5DCE4;--line-2:#C3CCD7;
  --accent:#2B57E0;--accent-ink:#FFFFFF;--accent-soft:#E3EAFC;
  --ok:#16825A;--ok-soft:#E0F2E9;--warn:#9A620C;--warn-soft:#FBEFD8;--err:#BF3434;--err-soft:#FBE5E5;
  --term:#101820;--term-ink:#D3DCE6;--term-muted:#7F8C9C;--fresh:#FFF3C4;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F141A;--surface:#171E26;--surface-2:#1C252F;--ink:#E4E9EF;--muted:#98A3B2;--line:#29333F;--line-2:#374352;
  --accent:#7C9BFF;--accent-ink:#0C1430;--accent-soft:#1D2947;
  --ok:#4BC28A;--ok-soft:#12302A;--warn:#E2A94A;--warn-soft:#342712;--err:#F07474;--err-soft:#3A1919;
  --term:#0A0F14;--term-ink:#D3DCE6;--term-muted:#76839A;--fresh:#3A3417;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A;--surface:#171E26;--surface-2:#1C252F;--ink:#E4E9EF;--muted:#98A3B2;--line:#29333F;--line-2:#374352;
  --accent:#7C9BFF;--accent-ink:#0C1430;--accent-soft:#1D2947;
  --ok:#4BC28A;--ok-soft:#12302A;--warn:#E2A94A;--warn-soft:#342712;--err:#F07474;--err-soft:#3A1919;
  --term:#0A0F14;--term-ink:#D3DCE6;--term-muted:#76839A;--fresh:#3A3417;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;font-weight:600}
h1{font-size:26px;letter-spacing:-.01em}
h2{font-size:21px;letter-spacing:-.005em}
h3{font-size:16px}
p{margin:0}
.mono{font-family:var(--mono);font-size:13.5px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.small{min-height:32px;padding:0 12px;font-size:14px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px}
.brand svg{flex:none}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn);font-weight:500}
.nav{display:flex;gap:4px;margin-left:12px;overflow-x:auto}
.nav button{border:0;background:transparent;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.top .spacer{flex:1}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}

/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.login-art{background:var(--term);color:var(--term-ink);padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login-art h1{font-size:34px;max-width:15ch;color:#fff;font-weight:600;letter-spacing:-.02em}
.login-art p{color:var(--term-muted);max-width:44ch;margin-top:14px}
.login-art pre{margin:0;font:13px/1.7 var(--mono);color:var(--term-ink);white-space:pre-wrap}
.login-art pre .k{color:#8FA7FF}.login-art pre .c{color:var(--term-muted)}
.login-form{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-form form{width:100%;max-width:380px;display:grid;gap:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.sso{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* fields */
.fld{display:grid;gap:6px}
.fld>span{font-size:14px;font-weight:500}
.fld small,.tog small{color:var(--muted);font-size:13px;display:block}
input[type=text],input[type=email],input[type=password],input[type=number],select,textarea{width:100%;min-height:40px;padding:8px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface)}
textarea{min-height:96px;resize:vertical;font-family:var(--mono);font-size:13px}
input:hover,select:hover,textarea:hover{border-color:var(--muted)}
input[readonly]{background:var(--surface-2)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;width:fit-content;max-width:100%}
.seg button{border:0;background:transparent;padding:6px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line-2)}
.tog{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;cursor:pointer;padding:12px 0;border-top:1px solid var(--line)}
.tog input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:36px;height:20px;border-radius:10px;background:var(--line-2);position:relative;margin-top:2px;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.tog input:checked+.sw{background:var(--accent)}
.tog input:checked+.sw::after{transform:translateX(16px)}
.tog input:focus-visible+.sw{outline:2px solid var(--accent);outline-offset:2px}
.tog b{font-weight:500}
.err{color:var(--err);font-size:14px;font-weight:500}

/* wizard layout */
.wiz{display:grid;grid-template-columns:230px minmax(0,1fr) 400px;min-height:calc(100vh - 56px)}
.rail{border-right:1px solid var(--line);padding:24px 12px;background:var(--surface)}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px;counter-reset:s}
.rail li button{width:100%;display:flex;align-items:center;gap:12px;padding:9px 10px;border:0;background:transparent;border-radius:8px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.rail li button[disabled]{cursor:default;opacity:.55}
.rail li button:not([disabled]):hover{background:var(--surface-2)}
.rail .n{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:12px;flex:none}
.rail .done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.rail .cur button{color:var(--ink);background:var(--accent-soft)}
.rail .cur .n{border-color:var(--accent);color:var(--accent)}
.main{padding:32px clamp(20px,4vw,48px) 48px;max-width:820px;width:100%}
.head{display:grid;gap:8px;margin-bottom:24px}
.head p{color:var(--muted);max-width:62ch}
.stack{display:grid;gap:20px}
.foot{display:flex;align-items:center;gap:12px;margin-top:32px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.foot .err{flex:1;min-width:200px}

.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.opt{display:grid;gap:6px;text-align:left;padding:16px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;position:relative}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-soft)}
.opt .mk{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;font-weight:600;font-size:13px;background:var(--surface-2);border:1px solid var(--line)}
.opt b{font-weight:600}
.opt small{color:var(--muted);font-size:13px;line-height:1.45}
.opt .rec{position:absolute;top:12px;right:12px;font-size:11.5px;font-weight:500;color:var(--ok);background:var(--ok-soft);padding:2px 8px;border-radius:99px}

.note{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:14px 16px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);font-size:14px}
.note.ok{background:var(--ok-soft);border-color:transparent}
.note.warn{background:var(--warn-soft);border-color:transparent}
.note.err{background:var(--err-soft);border-color:transparent;color:var(--ink);font-weight:400}
.note .ic{width:20px;height:20px;flex:none;margin-top:1px}
.agent{background:var(--accent-soft);border-color:transparent}
.agent .who{font-weight:600;color:var(--accent);font-size:13px;margin-bottom:2px}
.code{margin:0;padding:14px 16px;border-radius:10px;background:var(--term);color:var(--term-ink);font:12.5px/1.65 var(--mono);overflow-x:auto;white-space:pre}

.env-row{display:grid;grid-template-columns:1fr 1.4fr auto auto;gap:8px;align-items:center}
.env-row label.chk{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--muted);white-space:nowrap}

/* review */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.sum section{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface)}
.sum dl{margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.sum dt{color:var(--muted)}
.sum dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.list li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.cost{display:flex;align-items:baseline;gap:8px}
.cost b{font-size:28px;font-weight:600;letter-spacing:-.01em}

/* spec */
.spec{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));height:calc(100vh - 56px - env(safe-area-inset-top,0px))}
.spec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.spec-h h3{font-size:14px}
.spec-h small{color:var(--muted);font-size:12.5px;display:block;font-weight:400}
.spec pre{margin:0;flex:1;overflow:auto;padding:16px 0;font:12.5px/1.75 var(--mono)}
.spec pre span.l{display:block;padding:0 20px;white-space:pre}
.spec .k{color:var(--muted)}
.spec .v{color:var(--ink)}
.spec .u{color:var(--muted);font-style:italic;opacity:.7}
.spec .c{color:var(--muted);font-style:italic}
@media (prefers-reduced-motion:no-preference){.spec .fresh{animation:fr 1.6s ease-out}}
@keyframes fr{from{background:var(--fresh)}to{background:transparent}}
.spec-toggle{display:none}

/* deploy */
.page{padding:28px clamp(16px,3vw,40px) 48px;max-width:1280px;margin:0 auto}
.dhead{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:24px}
.dhead p{color:var(--muted);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:13px;font-weight:500;background:var(--surface-2);border:1px solid var(--line)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.run{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.pill.bad{color:var(--err);background:var(--err-soft);border-color:transparent}
@media (prefers-reduced-motion:no-preference){.pill.run .dot{animation:pl 1s ease-in-out infinite}}
@keyframes pl{50%{opacity:.3}}
.dgrid{display:grid;grid-template-columns:300px minmax(0,1fr);gap:20px;align-items:start}
.stages{list-style:none;margin:0;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.stages li{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 10px;border-radius:8px;font-size:14px}
.stages li.running{background:var(--accent-soft)}
.stages li.failed{background:var(--err-soft)}
.stages .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-2)}
.stages .done .st{background:var(--ok);border-color:var(--ok)}
.stages .running .st{border-color:var(--accent);border-top-color:transparent}
@media (prefers-reduced-motion:no-preference){.stages .running .st{animation:sp .8s linear infinite}}
@keyframes sp{to{transform:rotate(360deg)}}
.stages .failed .st{background:var(--err);border-color:var(--err)}
.stages .dur{color:var(--muted);font:12px var(--mono)}
.term{background:var(--term);border-radius:12px;overflow:hidden}
.term-h{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;color:var(--term-muted);font-size:13px;border-bottom:1px solid #ffffff14}
.term-b{height:420px;overflow:auto;padding:12px 16px;font:12.5px/1.7 var(--mono);color:var(--term-ink)}
.term-b div{white-space:pre-wrap;overflow-wrap:anywhere}
.term-b .cmd{color:#8FA7FF}.term-b .warn{color:#E8B559}.term-b .errl{color:#F28B8B}.term-b .okl{color:#6FD3A0}.term-b .dim{color:var(--term-muted)}
.result{margin-bottom:20px;padding:20px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;gap:14px}
.result.bad{border-color:var(--err)}
.result.good{border-color:var(--ok)}
.result .acts{display:flex;gap:8px;flex-wrap:wrap}
.diag{display:grid;gap:8px;padding:14px 16px;border-radius:10px;background:var(--accent-soft);font-size:14.5px}
.diag code{font:12.5px var(--mono);background:var(--surface);padding:1px 6px;border-radius:4px}

/* monitoring */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat small{color:var(--muted);font-size:13px}
.stat div{font-size:22px;font-weight:600;margin-top:2px}
.stat em{font-style:normal;font-size:12.5px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.chart h3{font-size:14px;display:flex;justify-content:space-between;font-weight:500}
.chart h3 span{color:var(--muted);font-weight:400}
.chart svg{width:100%;height:120px;display:block;margin-top:8px}
.two{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,1fr);gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.mono{font-size:12.5px;white-space:nowrap}
.lv{font:500 11.5px var(--mono);padding:1px 6px;border-radius:4px}
.lv.INFO{background:var(--surface-2);color:var(--muted)}.lv.WARN{background:var(--warn-soft);color:var(--warn)}.lv.ERROR{background:var(--err-soft);color:var(--err)}
.events{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.events li{display:grid;grid-template-columns:10px 1fr;gap:12px;font-size:14px}
.events .d{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--line-2)}
.events .ok .d{background:var(--ok)}.events .bad .d{background:var(--err)}.events .inf .d{background:var(--accent)}
.events small{color:var(--muted);display:block;font-size:12.5px}
.empty{text-align:center;padding:64px 20px;display:grid;gap:12px;justify-items:center}

/* agent drawer */
.scrim{position:fixed;inset:0;background:#0008;z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--surface);z-index:21;display:flex;flex-direction:column;border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.msgs{flex:1;overflow:auto;padding:16px;display:grid;gap:12px;align-content:start}
.msg{max-width:88%;padding:10px 14px;border-radius:12px;font-size:14.5px;background:var(--surface-2);border:1px solid var(--line)}
.msg.me{justify-self:end;background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.chips button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.ask{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line)}

@media (max-width:1180px){
  .wiz{grid-template-columns:210px minmax(0,1fr)}
  .spec{display:none;position:fixed;inset:auto 0 0 0;top:auto;height:70vh;z-index:15;border-left:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .spec.open{display:flex}
  .spec-toggle{display:inline-flex}
}
@media (max-width:820px){
  .login{grid-template-columns:1fr}
  .login-art{padding:32px 24px}
  .login-art pre{display:none}
  .wiz{grid-template-columns:1fr}
  .rail{border-right:0;border-bottom:1px solid var(--line);padding:10px;overflow-x:auto}
  .rail ol{display:flex;gap:4px}
  .rail li button{white-space:nowrap;padding:8px 10px}
  .dgrid,.two{grid-template-columns:1fr}
  .env-row{grid-template-columns:1fr 1fr}
  .top{padding:0 12px;gap:8px}
  .top .tag{display:none}
  .nav{margin-left:0}
}
@media (max-width:520px){.nav button{padding:8px}.brand span.bn{display:none}.top .btn .lbl{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const CLOUDS={
  aws:{name:'AWS',mk:'AW',regions:['ap-south-1','ap-southeast-2','us-east-1','eu-west-1','me-central-1'],
    svc:{container:'ECS Fargate',k8s:'EKS',serverless:'Lambda',vm:'EC2',static:'S3 + CloudFront'},
    methods:[['role','Cross-account role'],['keys','Access keys']],
    res:{registry:'ECR repository',lb:'Application Load Balancer',logs:'CloudWatch log group',net:'VPC with 2 private subnets',iam:'IAM task role',mon:'CloudWatch'}},
  gcp:{name:'Google Cloud',mk:'GC',regions:['asia-south1','australia-southeast1','us-central1','europe-west1','me-central1'],
    svc:{container:'Cloud Run',k8s:'GKE',serverless:'Cloud Functions',vm:'Compute Engine',static:'Cloud Storage + Cloud CDN'},
    methods:[['wif','Workload identity'],['sa','Service account key']],
    res:{registry:'Artifact Registry repository',lb:'HTTPS load balancer',logs:'Cloud Logging bucket',net:'VPC network',iam:'Service account',mon:'Cloud Monitoring'}},
  azure:{name:'Azure',mk:'AZ',regions:['centralindia','australiaeast','eastus','westeurope','uaenorth'],
    svc:{container:'Container Apps',k8s:'AKS',serverless:'Azure Functions',vm:'Virtual Machines',static:'Static Web Apps'},
    methods:[['fed','Federated credential'],['secret','Client secret']],
    res:{registry:'Container Registry',lb:'Application Gateway',logs:'Log Analytics workspace',net:'Virtual network',iam:'Managed identity',mon:'Azure Monitor'}},
  do:{name:'DigitalOcean',mk:'DO',regions:['blr1','syd1','nyc3','ams3','fra1'],

function runDeploy(from=0){

    <section class="panel"><div class="panel-h"><h3>Events</h3></div><ul class="events">
      <li class="inf"><span class="d"></span><div>Autoscaled to ${Math.max(2,+S.infra.min)} instances<small>14 min ago, CPU above 70%</small></div></li>
      ${hh.map(h=>`<li class="${h.status==='Succeeded'?'ok':'bad'}"><span class="d"></span><div>Deployment ${h.id} ${h.status.toLowerCase()}<small>${h.when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}, ${esc(h.branch)}</small></div></li>`).join('')}
      <li><span class="d"></span><div>Alert rule created: p95 latency above 300 ms<small>Sends to ${esc(S.pipe.notify)}</small></div></li>
    </ul></section>
  </div></div>`;
}
function historyView(){
  if(!S.history.length)return `<div class="page"><div class="empty"><h2>No deployments yet</h2><p class="muted">Every deployment you start shows up here with its logs and outcome.</p><button class="btn primary" data-action="go" data-val="wizard">Start a deployment</button></div></div>`;
  return `<div class="page"><div class="dhead"><div><h1>Deployments</h1><p>All projects and environments.</p></div><button class="btn primary" data-action="new">New deployment</button></div>
  <section class="panel"><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Repository</th><th>Branch</th><th>Target</th><th>Environment</th><th>Status</th><th>Duration</th><th>Started</th></tr></thead><tbody>
  ${S.history.map(h=>`<tr><td class="mono">${h.id}</td><td>${esc(h.repo)}</td><td class="mono">${esc(h.branch)}</td><td>${esc(h.cloud)} ${esc(h.svc)}</td><td>${esc(h.env)}</td><td><span class="pill ${h.status==='Succeeded'?'ok':'bad'}"><span class="dot"></span>${h.status}</span></td><td class="mono">${h.dur}</td><td class="mono">${h.when.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td></tr>`).join('')}
  </tbody></table></div></section></div>`;
}

/* agent */
function drawer(){return `<div class="scrim" data-action="agent"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Runway agent">
  <div class="drawer-h"><div><h3>Runway agent</h3><small class="muted" style="font-size:12.5px">Prototype: replies are scripted</small></div><button class="btn small ghost" data-action="agent">Close</button></div>
  <div class="msgs" aria-live="polite">${S.chat.map(c=>`<div class="msg ${c.me?'me':''}">${c.me?esc(c.m):c.m}</div>`).join('')}</div>
  <div class="chips">${['Why did the health check fail?','What will this cost?','Explain the generated Dockerfile','Is it safe to use access keys?'].map(q=>`<button data-action="agentAsk" data-val="${esc(q)}">${esc(q)}</button>`).join('')}</div>
  <form class="ask" id="askForm"><input type="text" id="askIn" placeholder="Ask about this deployment" aria-label="Message the agent"><button class="btn primary" type="submit">Send</button></form></aside>`}
function reply(q){q=q.toLowerCase();
  if(/health|fail|port|why/.test(q))return D.status==='failed'||S.history.some(h=>h.status==='Failed')?'The container logged <code>Server listening on port 8080</code>, but the load balancer was checking port '+esc(S.build.port==='8080'?'3000':S.build.port)+'. In your repo, <code>server.js</code> falls back to 8080 when <code>PORT</code> is unset. Setting the port to 8080 and adding <code>PORT=8080</code> fixes it, which is what the one-click fix does.':'No failures so far. If a deployment fails I read the step logs, the cloud events and your source code together, then propose a specific fix you can apply.';
  if(/cost|price|bill/.test(q))return `At minimum scale this plan is about <b>$${estimate()}/month</b>. The biggest line items are compute (${SIZES[S.infra.size][1]} per instance)${S.target.type==='k8s'&&S.infra.cluster==='new'?' and the Kubernetes control plane':''}${S.infra.db!=='none'?' and the managed database':''}. Scaling to ${esc(S.infra.max)} instances at peak would add roughly $${SIZES[S.infra.size][2]*Math.max(0,(+S.infra.max)-(+S.infra.min))}.`;
  if(/docker/.test(q))return 'It uses a two-stage build: dependencies and the build run in the first stage, and only the output is copied into a small runtime image. That keeps the image small and leaves compilers and dev dependencies out of production.';
  if(/key|safe|secur/.test(q))return 'They work, but a cross-account role (or workload identity on GCP) is safer: nothing long-lived is stored, access can be revoked in your account at any time, and every action is logged in your cloud audit trail under a named role.';
  if(/error|log/.test(q))return 'Two errors stand out. The webhook signature mismatch comes from a single IP, which usually means a misconfigured test sender, not your code. The ledger-service timeout is worth watching: it lines up with the latency spike, so I would add a circuit breaker or raise the timeout budget.';
  return 'In the full product I would answer this using your repository, cloud account and logs. In this prototype, try one of the suggested questions.';
}
function ask(q){if(!q.trim())return;S.chat.push({me:true,m:q},{me:false,m:reply(q)});S.agentOpen=true;render();setTimeout(()=>$('#askIn')?.focus(),0)}

/* validation + navigation */
function validate(){
  switch(S.step){
  case 0:return S.cloud?'':'Choose a cloud to continue.';
  case 1:return S.access.connected?'':'Test the connection before continuing.';
  case 2:if(!S.repo.connected)return 'Connect your repository provider first.';return S.repo.name?'':'Choose a repository.';
  case 3:return S.target.type?'':'Choose how the app should run.';
  case 4:if(isStatic())return S.build.outDir?'':'Enter the output folder of your build.';if(!S.build.start)return 'Enter a start command.';return /^\d{2,5}$/.test(S.build.port)?'':'Enter the port your app listens on, for example 3000.';
  case 5:if(!(+S.infra.min>=1))return 'Set at least 1 minimum instance.';if(+S.infra.max<+S.infra.min)return 'Maximum instances must be at least the minimum.';if(S.target.type==='k8s'&&S.infra.cluster==='existing'&&!S.infra.clusterName)return 'Enter the name of your existing cluster.';return '';
  case 6:return S.pipe.tests&&!S.pipe.testCmd?'Enter a test command, or turn off tests.':'';
  case 7:return S.reviewed?'':'Confirm you have reviewed the plan.';
  }return '';
}
function accessMissing(){const a=S.access,m=a.method,need={role:['accountId','roleArn'],keys:['keyId','secret'],wif:['project','provider','saEmail'],sa:['project','saJson'],fed:['tenant','client','sub'],secret:['tenant','client','sub','clientSecret'],token:['token']}[m]||[];return need.filter(k=>!String(a[k]).trim()).length}

const actions={
  sso(){S.user='engineer@company.com';S.view='wizard';render()},
  go(el){S.view=el.dataset.val;S.agentOpen=false;render();window.scrollTo(0,0)},
  new(){S.view='wizard';S.step=0;render()},
  jump(el){S.step=+el.dataset.val;S.err='';render();window.scrollTo(0,0)},
  back(){S.step--;S.err='';render();window.scrollTo(0,0)},
  next(){const e=validate();S.err=e;if(e){render();$('.foot .err')?.scrollIntoView({block:'nearest'});return}S.step++;S.far=Math.max(S.far,S.step);render();window.scrollTo(0,0)},
  spec(){S.specOpen=!S.specOpen;$('.spec')?.classList.toggle('open',S.specOpen)},
  test(){const miss=accessMissing();if(miss){S.err=`Fill in ${miss===1?'the missing field':'all '+miss+' missing fields'} before testing.`;render();return}S.err='';S.access.testing=true;render();setTimeout(()=>{S.access.testing=false;S.access.connected=true;render()},1100)},
  connectRepo(){if(S.repo.auth==='token'&&!S.repo.token.trim()){S.err='Paste an access token first.';render();return}S.err='';S.repo.connected=true;render()},
  addEnv(){S.pipe.env.push({k:'',v:'',s:false});render()},
  rmEnv(el){S.pipe.env.splice(+el.dataset.val,1);render()},
  deploy(){const e=validate();S.err=e;if(e){render();return}D.fixed=false;S.view='deploy';runDeploy(0);window.scrollTo(0,0)},
  fix(){D.fixed=true;S.build.port='8080';if(!S.pipe.env.some(e=>e.k==='PORT'))S.pipe.env.push({k:'PORT',v:'8080',s:false});const idx=stagesFor().findIndex(s=>s.id==='release');runDeploy(idx)},
  agent(){S.agentOpen=!S.agentOpen;render();if(S.agentOpen)setTimeout(()=>$('#askIn')?.focus(),0)},
  agentAsk(el){ask(el.dataset.val)}
};
function onSet(p,v){
  if(p==='cloud'){const c=CLOUDS[v];S.access.method=c.methods[0][0];S.access.region=c.regions[0];S.access.connected=false}
  if(p==='access.method')S.access.connected=false;
  if(p==='repo.provider'||p==='repo.auth'){S.repo.connected=false;S.repo.name='';S.repo.scanned=false}
  if(p==='target.type'&&v==='static'){S.build.stack='React / Vue / Angular';applyStack()}
}
function applyStack(){const d=STACKS[S.build.stack];S.build.version=d.v;S.build.buildCmd=d.build;S.build.start=d.start;S.build.port=d.port;if(S.build.stack==='Node.js')S.pipe.testCmd='npm test';else if(S.build.stack==='Python')S.pipe.testCmd='pytest';else if(S.build.stack==='Go')S.pipe.testCmd='go test ./...';}

const app=$('#app');
app.addEventListener('click',e=>{
  const s=e.target.closest('[data-set]');
  if(s){set(s.dataset.set,s.dataset.val);onSet(s.dataset.set,s.dataset.val);S.err='';render();return}
  const a=e.target.closest('[data-action]');if(a&&actions[a.dataset.action]){e.preventDefault();actions[a.dataset.action](a)}
});
app.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const pos=e.target.selectionStart;render();const q=$('#q');q.focus();q.setSelectionRange(pos,pos);return}
  const el=e.target.closest('[data-bind]');if(!el)return;
  set(el.dataset.bind,el.type==='checkbox'?el.checked:el.value);
  if(el.dataset.bind.startsWith('access.')&&el.dataset.bind!=='access.region')S.access.connected=false;
  if(S.err){S.err='';const fe=$('.foot .err');if(fe)fe.textContent=''}
  updateSpec(false);
});
app.addEventListener('change',e=>{
  const el=e.target.closest('[data-bind]');if(!el)return;
  if(el.dataset.bind==='build.stack')applyStack();
  if(el.dataset.bind==='repo.name'){S.repo.scanned=!!el.value}
  if(el.hasAttribute('data-re'))render();else updateSpec(false);
});
app.addEventListener('submit',e=>{
  e.preventDefault();
  if(e.target.id==='loginForm'){const em=$('#em').value.trim(),pw=$('#pw').value;const er=$('#lerr');
    if(!/^\S+@\S+\.\S+$/.test(em)){er.textContent='Enter a valid work email.';$('#em').focus();return}
    if(!pw){er.textContent='Enter your password.';$('#pw').focus();return}
    S.user=em;S.view='wizard';render()}
  if(e.target.id==='askForm'){ask($('#askIn').value)}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.agentOpen){S.agentOpen=false;render()}});
render();
</script>
</body>
</html>
