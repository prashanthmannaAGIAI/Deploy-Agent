<svg xmlns="http://www.w3.org/2000/svg" viewBox="180 16 840 316" role="img" aria-labelledby="title desc">
  <!-- Spacing-corrected version of aiops-logo-original.svg: "Ai" moved so both gaps to the ring
       match, the mark re-centred on the tagline, and the sparkle moved above "Ops".
       Colours, gradient, typography and shapes are unchanged. -->
  <title id="title">AiOps — Your DevOps Agent</title>
  <desc id="desc">A navy AiOps wordmark with a cyan-to-indigo circular O emblem containing Ops and a small sparkle, above the tagline Your DevOps Agent.</desc>
  <defs>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11B7E9"/>
      <stop offset="0.52" stop-color="#2878E8"/>
      <stop offset="1" stop-color="#3436A8"/>
    </linearGradient>
  </defs>
  <g fill="#10264B" font-family="Inter, Avenir Next, Montserrat, Arial, sans-serif" font-weight="750">
    <text x="201" y="220" font-size="220" letter-spacing="-13">Ai</text>
    <text x="755" y="220" font-size="220" letter-spacing="-13">ps</text>
  </g>
  <g transform="translate(580 151)">
    <circle r="111" fill="none" stroke="url(#orbit)" stroke-width="27"/>
    <circle r="78" fill="#FFFFFF"/>
    <path d="M0 -56 L10 -13 L53 0 L10 13 L0 56 L-10 13 L-53 0 L-10 -13 Z" fill="#10AEE8" transform="translate(0 -40) scale(.4)"/>
    <text x="0" y="30" text-anchor="middle" fill="#10264B" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="48" font-weight="750" letter-spacing="-2">Ops</text>
  </g>
  <text x="600" y="316" text-anchor="middle" fill="#29466B" font-family="Inter, Avenir Next, Arial, sans-serif" font-size="34" font-weight="500" letter-spacing="8">YOUR DEVOPS AGENT</text>
</svg>
